#
# damavik.yaml - copy to ~/.config/damavik/damavik.yaml or /etc/damavik/
#
# Every key below is the default.  An unknown key is a hard error, so a typo
# can never silently disable a control.

host_id: auto            # "auto" uses the hostname; set a stable id for fleets
offline: false           # true = kill every intel plugin, forever, for this run
retention_days: 7        # events older than this are pruned when a run starts;
                         # the batch a run is processing is never pruned by it,
                         # so replaying an old capture keeps every event
state_dir: ~/.local/state/damavik

sensor:
  flows: true
  dns: true              # requires the eBPF sensor; sensor-py cannot see DNS
  exec_hash: true        # SHA-256 every executed binary (skipped above 64 MiB)
  poll_interval_s: 2.0   # sensor-py only; eBPF is event-driven

# Every provider below is opt-in.  Nothing here talks to the network unless you
# flip `enabled` yourself, and `offline: true` overrides all of them.
intel:
  osv_mirror:
    enabled: true        # keyless, local files only - no network after sync
    sync: weekly
    dir: ~/.local/share/damavik/osv
  bazaar:
    enabled: false       # keyless: sends SHA-256 hashes, never file contents
  urlhaus:
    enabled: false       # keyless: sends domains/URLs

dashboard:
  enabled: true
  bind: 127.0.0.1        # the only accepted value - the MVP has no LAN mode
  port: 8787
  token_env: DAMAVIK_TOKEN

alerts:
  path: alerts.log       # relative paths live under state_dir
  notify: true           # notify-send on Linux; never blocks, never raises
  cooldown_s: 300        # one alert per (rule, indicator) per cooldown window
  min_score: 45.0        # below this, rule hits still log but do not alert

limits:
  max_event_bytes: 65536      # larger sensor lines are dropped and counted
  max_response_bytes: 1048576 # hard cap on any intel response body

scoring:
  allowlist_exes:
    - /usr/bin/systemd
    - /usr/lib/systemd/systemd
    - /sbin/init
  allowlist_hashes: []
  common_ports: [22, 53, 80, 443, 465, 587, 993, 995, 5353]

rules:
  dir: rules

# Environment overrides (they win over this file, the command line wins over
# them): DAMAVIK_STATE_DIR, DAMAVIK_RULES_DIR, DAMAVIK_HOST_ID,
# DAMAVIK_RETENTION_DAYS, DAMAVIK_OFFLINE.  The systemd units use the first two:
# a sandboxed service cannot rely on ~/.local/state being writable.
