{
  "_comment": [
    "SPDX-FileCopyrightText: 2026 Leonidas Zervas and Damavik contributors",
    "SPDX-License-Identifier: GPL-3.0-only",
    "",
    "Damavik osquery pack. osquery is an OPTIONAL sidecar (Apache-2.0, separate",
    "process, never linked). It supplies the host facts a syscall sensor cannot",
    "see cheaply: the package inventory, autoruns and listening ports.",
    "",
    "Every query here is a DIFFERENTIAL: osquery only emits a row when it",
    "appears or disappears. Damavik's pkgwatch turns those into pkg.event and",
    "sys.event, so a new autorun is an event, not a scan result.",
    "",
    "Install:",
    "  sudo cp osquery/packs/damavik.conf /etc/osquery/damavik.conf",
    "  add  {\"packs\": {\"damavik\": \"/etc/osquery/damavik.conf\"}}  to osquery.conf",
    "  set  --events_expiry=3600 --disable_events=false --json",
    "",
    "Damavik reads the resulting log lines; it does not talk to osquery directly."
  ],
  "platform": "linux",
  "queries": {
    "damavik_processes": {
      "query": "SELECT pid, parent, name, path, cmdline, uid, start_time FROM processes WHERE path != '';",
      "interval": 60,
      "description": "Process inventory for the ancestry graph and first-seen baselining"
    },
    "damavik_listening_ports": {
      "query": "SELECT pid, port, protocol, address, family FROM listening_ports WHERE port > 0;",
      "interval": 60,
      "description": "New listener -> sys.event(meta.kind=listen, meta.action=new). A surprise listener is one of the highest-value signals available"
    },
    "damavik_startup_items": {
      "query": "SELECT name, source, path, args FROM startup_items;",
      "interval": 300,
      "description": "Login items and init scripts"
    },
    "damavik_autoruns_cron": {
      "query": "SELECT path, minute, hour, command, user FROM crontab;",
      "interval": 300,
      "description": "Cron entries -> sys.event(meta.kind=autorun). Cron is the cheapest persistence on Linux"
    },
    "damavik_autoruns_systemd": {
      "query": "SELECT name, path, source, user, status FROM systemd_units WHERE type = 'service' AND status = 'enabled';",
      "interval": 300,
      "description": "Enabled systemd units -> sys.event(meta.kind=autorun)"
    },
    "damavik_packages_deb": {
      "query": "SELECT name, version, arch, revision, source FROM deb_packages;",
      "interval": 3600,
      "description": "Debian inventory -> pkg.event, matched against the local OSV mirror (DMK-V-001/002)"
    },
    "damavik_packages_rpm": {
      "query": "SELECT name, version, release, arch FROM rpm_packages;",
      "interval": 3600,
      "description": "RPM inventory for rpm-based distros"
    },
    "damavik_kernel_modules": {
      "query": "SELECT name, size, status, sha256 FROM kernel_modules WHERE status = 'Live';",
      "interval": 1800,
      "description": "Loaded kernel modules. Rootkit detection is explicitly out of scope, but a new unsigned module is worth knowing about"
    }
  }
}
