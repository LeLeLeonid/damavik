#
# CI. Two promises this workflow keeps:
#
#   1. The Python job needs NO services, NO root and NO network. If a change
#      makes the suite depend on any of those, that is the failure.
#   2. Performance budgets are gates, not suggestions.
#
# No Rust job yet: sensor/ does not exist until P1. Adding one before there is
# something to compile would mean a permanently red (or permanently ignored) job.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: brain (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev tools
        run: python -m pip install --upgrade pip pytest ruff

      - name: Lint
        run: ruff check brain tests

      - name: Format check
        run: ruff format --check brain tests

      - name: Unit tests
        run: pytest tests/ -q

      - name: End-to-end self-test (offline, no root)
        working-directory: brain
        run: python -m damavik.cli --offline selftest

      # The first-run experience is a feature: a fixture whose timestamps age
      # out of the retention window used to turn this into "27 alerts
      # (showing 0)" and nothing caught it.
      - name: Demo capture produces ranked alerts
        working-directory: brain
        run: |
          python -m damavik.cli --offline demo --limit 3 | tee /tmp/demo.txt
          grep -q "showing 3" /tmp/demo.txt

      # `pip install .` is a documented entry point, so it is tested as one: a
      # venv with no checkout, from a directory that has neither rules/ nor
      # tests/, must be able to run the self-test. Vendored data drift (rules
      # copied into the package) is caught by tests/test_packaging.py.
      - name: pip install and run outside the checkout
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet .
          mkdir -p /tmp/nowhere && cd /tmp/nowhere
          /tmp/wheelcheck/bin/damavik selftest
          /tmp/wheelcheck/bin/damavik selftest --json | grep -q '"failures": \[\]'

      - name: Performance budgets
        working-directory: brain
        run: python -m damavik.cli --offline bench --events 5000 --gate

  packaging:
    name: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Packaging invariants
        run: |
          python -m pip install --quiet pytest
          pytest tests/test_packaging.py -q

      # The installer is the no-pip path, and it shipped a launcher that could
      # not even import the package (`python3 share/damavik/cli.py`), two units
      # that monitored nothing, and a --config flag the units passed in a
      # position argparse rejected.  Running it into a throwaway prefix is the
      # only gate that catches all four.
      - name: install.sh into a throwaway prefix, then use the installed command
        run: |
          ALLOW_NONROOT=1 PREFIX="$RUNNER_TEMP/prefix" \
            BIN_DIR="$RUNNER_TEMP/prefix/bin" \
            SHARE_DIR="$RUNNER_TEMP/prefix/share/damavik" \
            CONFIG_DIR="$RUNNER_TEMP/prefix/etc/damavik" \
            STATE_DIR="$RUNNER_TEMP/prefix/var/lib/damavik" \
            UNIT_DIR="$RUNNER_TEMP/prefix/etc/systemd/system" \
            ENABLE=0 sh packaging/install.sh
          export PATH="$RUNNER_TEMP/prefix/bin:$PATH"
          cd "$RUNNER_TEMP"
          damavik --version
          damavik --offline selftest
          damavik --offline demo --limit 3 | grep -q "showing 3"
          # The units' own ExecStart and Environment= lines.  Exported, not
          # prefixed onto the first command: `A=1 sensor | run` passes A to the
          # sensor only, and the run half would write somewhere else entirely.
          export DAMAVIK_STATE_DIR="$RUNNER_TEMP/prefix/var/lib/damavik"
          export DAMAVIK_RULES_DIR="$RUNNER_TEMP/prefix/share/damavik/rules"
          damavik sensor --once | damavik run --config \
            "$RUNNER_TEMP/prefix/etc/damavik/damavik.yaml"
          damavik status --json | grep -qE '"events": [1-9]'
          damavik verify
          test -s "$DAMAVIK_STATE_DIR/journal.jsonl"

  rules:
    name: rules and schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Every rule loads and has TP+FP fixtures
        run: pytest tests/test_rules.py -q

      - name: Every fixture validates against the schema
        run: |
          cd brain
          for f in ../tests/fixtures/*.jsonl; do
            python -m damavik.cli validate "$f"
          done

      - name: Published JSON schemas match the Python validator
        run: pytest tests/test_schema.py -q

      - name: Privacy invariants
        run: pytest tests/test_privacy.py -q

  reuse:
    name: licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: REUSE compliance
        uses: fsfe/reuse-action@v5
