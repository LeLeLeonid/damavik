title: Large upload in a single flow
id: DMK-N-004
status: test
level: medium
description: >-
  More than 5 MiB pushed out in one connection - archiving and exfiltration
  both look like this.  Loopback is excluded because it cannot leave the host;
  a LAN destination is deliberately still in scope, because a 5 MiB push to a
  file share is worth a look even when it is probably the nightly backup.
tags:
  - attack.exfiltration
  - attack.t1041
logsource:
  category: network_connect
selection:
  net.bytes_out|gte: 5242880
not_egress:
  meta.is_local: true
condition: selection and not not_egress
