title: Egress to an unusual service port
id: DMK-N-001
status: stable
level: medium
description: >-
  Endpoints have no business talking to IRC or the classic listener ports.
tags:
  - attack.command_and_control
  - attack.t1571
logsource:
  category: network_connect
selection:
  net.dport:
    - 1337
    - 4444
    - 5555
    - 6666
    - 6667
    - 6697
    - 31337
    - 12345
# Loopback and link-local traffic never leaves the host, so it is not egress.
# The flow is still stored and scored; it just does not raise this alert.
not_egress:
  meta.is_local: true
condition: selection and not not_egress
