title: Repeated egress to one destination (beacon proxy)
id: DMK-N-003
status: test
level: medium
description: >-
  Six or more connections to the same destination inside two minutes.  This is
  a cheap periodicity proxy; true interval-variance beacon scoring arrives in
  P3 with the flow-graph work.  Loopback and LAN destinations are excluded
  (``meta.is_local`` / ``meta.is_private``): local IPC and a NAS or backup
  share on the same subnet both look like this, and neither is a beacon.  A
  beacon on the LAN is still recorded, scored and visible in the flow graph.
tags:
  - attack.command_and_control
  - attack.t1071
logsource:
  category: network_connect
selection:
  net.dst|exists: true
not_egress:
  meta.is_local: true
lan:
  meta.is_private: true
condition: selection and not not_egress and not lan
correlate:
  group_by: net.dst
  window_s: 120
  min_count: 6
